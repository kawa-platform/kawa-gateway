# Release: push a tag like v0.1.0 (or v0.1.0-rc.1 for a pre-release) that points at a commit on main.
# Verifies the build, publishes ghcr.io/kawa-platform/kawa-gateway:<version> for amd64 + arm64 and
# creates a GitHub Release with generated notes. The pom version is stamped from the tag in CI only;
# nothing is committed back.

name: Release

on:
  push:
    tags: [ 'v*.*.*' ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a semantic version (expected vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      version: ${{ needs.verify.outputs.version }}

  github-release:
    needs: [ verify, image ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          body: |
            ## Docker image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`.
