listeners:
  - host: 0.0.0.0
    port: 9092

clusters:
  default:
    bootstrapServers:
      - kafka:9092

auth:
  brokerAuth:
    mechanism: PLAIN
    username: kawa
    password: kawa-secret

advertised:
  nodeId: 1
  host: localhost
  port: 9092

admin:
  enabled: true
  host: 0.0.0.0
  port: 8080
  # Open admin API (no login) for this local demo. admin.auth.type defaults to oauth, so the opt-out
  # must be explicit; the gateway warns at startup that the admin API is unauthenticated.
  auth:
    type: none
  cors:
    allowedOrigins:
      - http://localhost:5173
