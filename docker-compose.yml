services:
  kafka:
    image: apache/kafka-native:4.3.1
    container_name: kawa-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # PLAINTEXT is for clients inside the compose network (the gateway);
      # EXTERNAL is published to the host so host-side tools can inspect the broker.
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://kafka:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: kawa-kafka-init
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do
          echo "waiting for kafka...";
          sleep 1;
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic orders-v2 --partitions 1 --replication-factor 1
        echo "orders-v2 ready"
    restart: "no"

  gateway:
    build: .
    container_name: kawa-gateway
    depends_on:
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "9092:9092"
      - "8080:8080"
    environment:
      KAWA_LOG_LEVEL: DEBUG
    volumes:
      - ./docker/gateway.yaml:/etc/kawa/config.yaml:ro
