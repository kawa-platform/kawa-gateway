openapi: 3.0.3
info:
  title: Kawa Admin API
  description: |
    HTTP surface of the Kafka Access Gateway (kawa) admin server. Exposes gateway state
    (virtual and physical topics) to a UI and reads/writes the dynamic gateway config
    (RBAC roles and groups, auth clients, governance) through the config topic.

    Config writes are persisted to the config topic and applied asynchronously by the
    gateway's config consumer: a successful write response means the change is persisted,
    not necessarily applied yet.

    The server binds to `admin.host`/`admin.port` (defaults `0.0.0.0:8080`). Unknown
    paths return `404`, known paths hit with the wrong method return `405`, and handler
    or serialization failures return `500` - all with an `{"error": "..."}` body.

    Authentication is configured with `admin.auth`. With `type: none` (the default) the API is
    open. With `type: oauth`, kawa acts as a headless OAuth 2.0 authorization server: clients use
    the authorization code flow with PKCE (`/oauth/authorize`, the external login UI posting to
    `/oauth/login`, then `/oauth/token`) and send the access token as
    `Authorization: Bearer <token>`. Every endpoint except `/oauth/*`, `/.well-known/*` and `/docs`
    then answers `401` without a valid token.

    The same port also serves an MCP server at `POST /mcp` (stateless Streamable HTTP, JSON-RPC
    2.0; not described here). It requires the same authentication; its tools answer with the JSON
    of the corresponding admin endpoint (e.g. `list_topics` ↔ `GET /topics`).
  version: 0.1.0-SNAPSHOT
security:
  - bearerAuth: []
paths:
  /topics:
    get:
      summary: List virtual and physical topics
      description: |
        Projects the virtual topics from the gateway's virtual-topic config and the
        physical topics from the live broker metadata cache.
      responses:
        '200':
          description: The topics currently served by the gateway
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicView'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create a topic
      description: |
        Unified topic creation. Both kinds run the governance admission check first (`403`
        with the violations when refused). A `"type": "virtual"` body then writes a virtual
        topic config through the config repository, judged on `CREATE` or, when it already
        exists, `ALTER`; a `"type": "physical"` body creates the topic on the broker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicRequest'
      responses:
        '201':
          description: Topic created
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VirtualTopicConfigView'
                  - $ref: '#/components/schemas/TopicSpecView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /topics/{name}:
    put:
      summary: Upsert a virtual topic config
      description: |
        Upserts the virtual topic config for `name`. The body uses the same `type`
        discriminator as `POST /topics`; only `"type": "virtual"` is supported (physical
        topic alteration is not implemented). Governance judges it on `CREATE` for a new
        virtual topic and on `ALTER` for an existing one (`403` when refused).
      parameters:
        - $ref: '#/components/parameters/TopicName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicRequest'
      responses:
        '200':
          description: The stored virtual topic config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualTopicConfigView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Update a virtual topic config
      description: |
        Partially updates the virtual topic identified by `name`. Omitted fields retain their
        current values; an omitted or null `filter` produces no filter. The optional `name`
        field atomically renames the virtual topic and must not collide with an existing topic.
        Governance judges the result on `ALTER`, under the new name (`403` when refused).
      parameters:
        - $ref: '#/components/parameters/TopicName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualTopicConfigPatch'
      responses:
        '200':
          description: The resulting virtual topic config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualTopicConfigView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a topic
      description: |
        Removes a virtual topic's config when `name` is a virtual topic, otherwise deletes
        the physical topic on the broker. A name that is both virtual and physical resolves
        to the virtual config removal (the safer operation - no broker data loss). Governance
        judges the topic as it is on `DELETE` first (`403` when refused).
      parameters:
        - $ref: '#/components/parameters/TopicName'
      responses:
        '204':
          description: Topic deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /rbac/roles:
    get:
      summary: List RBAC roles
      description: The roles from the dynamic config, each a list of ACLs.
      responses:
        '200':
          description: The roles, each with its name and ACLs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleConfigView'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /rbac/roles/{name}:
    put:
      summary: Upsert an RBAC role
      description: Adds or replaces the role `name` and persists the new config snapshot.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleConfigRequest'
      responses:
        '200':
          description: The stored role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePutView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete an RBAC role
      description: Removes the role `name` and persists the new config snapshot.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      responses:
        '204':
          description: Role deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /rbac/groups:
    get:
      summary: List RBAC groups
      description: The groups from the dynamic config, each a client list plus the roles those clients inherit.
      responses:
        '200':
          description: The groups, each with its name, clients and roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupConfigView'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /rbac/groups/{name}:
    put:
      summary: Upsert an RBAC group
      description: Adds or replaces the group `name` and persists the new config snapshot.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupConfigRequest'
      responses:
        '200':
          description: The stored group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupPutView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Rename an RBAC group
      description: Re-keys the group `name` under the new name from the body. The group's clients and roles move with it; the new name must not already exist.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupConfigPatch'
      responses:
        '200':
          description: The renamed group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupConfigView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete an RBAC group
      description: Removes the group `name` and persists the new config snapshot.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      responses:
        '204':
          description: Group deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/clients:
    get:
      summary: List auth clients
      description: The SASL clients from the dynamic config.
      responses:
        '200':
          description: The clients, each with its username and mechanism
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientConfigView'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/clients/{name}:
    put:
      summary: Upsert an auth client
      description: Adds or replaces the client `name` and persists the new config snapshot.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientConfigRequest'
      responses:
        '200':
          description: The stored client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfigView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      summary: Update an auth client
      description: Updates one or both fields of the client `name` and persists the new config snapshot. Fields omitted from the body keep their stored value; the client must already exist. The password is write-only and never returned.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientConfigPatch'
      responses:
        '200':
          description: The stored client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientConfigView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete an auth client
      description: Removes the client `name` and persists the new config snapshot.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      responses:
        '204':
          description: Client deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /governance/rules:
    get:
      summary: List governance rules
      description: The governance section - every rule, each with its own exemptions, and every global exemption.
      responses:
        '200':
          description: The governance rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceConfigView'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /governance/rules/{name}:
    get:
      summary: Read a governance rule
      description: The governance rule `name`, including its exemptions.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      responses:
        '200':
          description: The governance rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceRuleConfigView'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Upsert a governance rule
      description: |
        Adds or replaces the governance rule `name` and persists the new config snapshot. The
        name always comes from the path: the body's `name` is optional, and when present it must
        equal the path name. Every expression is compiled against the rule's resource type before
        anything is written, so an invalid rule is rejected here with `400` and a message naming
        the rule and the field at fault, instead of failing the config-topic consumer later.
        A body with only a top-level `expression` (no `subRules`) is accepted and becomes one check.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceRuleRequest'
      responses:
        '200':
          description: The stored governance rule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceRuleConfigView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a governance rule
      description: Removes the governance rule `name` and persists the new config snapshot.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      responses:
        '204':
          description: Rule deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /governance/exemptions:
    get:
      summary: List global governance exemptions
      description: Every global exemption. Each skips every rule when its expression is `true` for a request.
      responses:
        '200':
          description: The global exemptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GovernanceExemption'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /governance/exemptions/{name}:
    get:
      summary: Read a global governance exemption
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      responses:
        '200':
          description: The global exemption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceExemption'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Upsert a global governance exemption
      description: |
        Adds or replaces the global exemption `name`. The name comes from the path; the body's
        `name` is optional and must equal it. The expression may read `principal`, `service` and
        any resource variable (`topic`, `group`, `transaction`); only the requested resource is
        bound, and an exemption that fails to evaluate does not apply.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceExemption'
      responses:
        '200':
          description: The stored global exemption
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceExemption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a global governance exemption
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      responses:
        '204':
          description: Exemption deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /governance/variables:
    get:
      summary: List governance variables
      description: Every governance variable. Expressions read them by name.
      responses:
        '200':
          description: The variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GovernanceVariable'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /governance/variables/{name}:
    put:
      summary: Upsert a governance variable
      description: |
        Adds or replaces the variable `name`. The value must be a JSON literal of the declared
        type. The whole governance section is compiled with the change first, so a type change
        that breaks a rule reading the variable is refused with `400`.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceVariable'
      responses:
        '200':
          description: The stored variable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceVariable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a governance variable
      description: Removes the variable `name`; refused with `400` while a rule or exemption still reads it.
      parameters:
        - $ref: '#/components/parameters/ConfigEntryName'
      responses:
        '204':
          description: Variable deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /governance/dry-run:
    post:
      summary: Dry-run governance for a request
      description: |
        Evaluates a request the way the gateway would, without creating or storing anything,
        and returns every rule's trace down to each check. With `rule`, evaluates that unsaved
        rule alone against the stored variables (global exemptions are not consulted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceDryRunRequest'
      responses:
        '200':
          description: The decision and its trace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceDryRunView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth/authorize:
    get:
      summary: Start the authorization code flow
      description: |
        The authorization endpoint (RFC 6749 §4.1 with PKCE, RFC 7636). Only exists with
        `admin.auth.type: oauth`. kawa serves no login page: a valid request is redirected to the
        external login UI (`admin.auth.settings.loginUrl`) with a `login_challenge`. An unknown
        client or redirect URI is answered with `400`; other errors are redirected to the client.
      security: []
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: state, in: query, required: false, schema: {type: string}}
      responses:
        '302':
          description: To the login UI with `login_challenge`, or back to the client with an `error`
        '400':
          description: Unknown client or redirect URI (not redirected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
  /oauth/login:
    post:
      summary: Log in for a login challenge
      description: |
        Called by the external login UI. Verifies the user's credentials for the pending
        authorization request in `login_challenge` and returns where to send the browser: the
        client's redirect URI with a single-use authorization code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login_challenge, username, password]
              properties:
                login_challenge:
                  type: string
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Where to send the browser next
          content:
            application/json:
              schema:
                type: object
                required: [redirect_to]
                properties:
                  redirect_to:
                    type: string
        '400':
          description: |
            `invalid_request`, `invalid_challenge` (expired: start again) or `invalid_credentials`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
  /oauth/token:
    post:
      summary: Obtain an access token
      description: |
        The token endpoint of kawa's built-in authorization server (RFC 6749). Only exists with
        `admin.auth.type: oauth`. Supports the authorization code grant with PKCE, which redeems
        a code from `/oauth/login` and starts a session, and the refresh token grant, which
        continues it: the refresh token is rotated but the session end
        (`admin.auth.settings.sessionTtl`) stays the same. The password grant is not supported.
        Responses carry `Cache-Control: no-store`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                client_id:
                  type: string
                  description: Required for `authorization_code`.
                code:
                  type: string
                  description: Required for `authorization_code`.
                redirect_uri:
                  type: string
                  description: Required for `authorization_code`; the one used at `/oauth/authorize`.
                code_verifier:
                  type: string
                  description: Required for `authorization_code` (PKCE).
                refresh_token:
                  type: string
                  description: Required for `refresh_token`.
      responses:
        '200':
          description: An access token (`at+jwt`) and a refresh token (`rt+jwt`), both ES256-signed JWTs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: |
            `invalid_grant` (an invalid, expired or already used code, a PKCE mismatch, or an invalid
            or expired refresh token), `unsupported_grant_type` or `invalid_request`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenError'
  /.well-known/jwks.json:
    get:
      summary: Public signing keys
      description: |
        The JWK set that verifies kawa's access tokens. Only exists with `admin.auth.type: oauth`.
      security: []
      responses:
        '200':
          description: The public JWK set
          content:
            application/json:
              schema:
                type: object
  /.well-known/oauth-authorization-server:
    get:
      summary: Authorization server metadata
      description: |
        RFC 8414 metadata: issuer, token endpoint, JWKS location and supported grants. Only exists
        with `admin.auth.type: oauth`. Endpoint URLs are derived from the `Host` and
        `X-Forwarded-Proto` request headers.
      security: []
      responses:
        '200':
          description: The metadata document
          content:
            application/json:
              schema:
                type: object
  /admin/users:
    get:
      summary: List admin users
      description: |
        The admin API users stored in the config topic, sorted by email. This includes the bootstrap
        user, which the gateway creates from `admin.auth.bootstrapUser` on a start without admin users.
      responses:
        '200':
          description: The admin users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      summary: Create an admin user
      description: |
        Creates an admin user under a new, gateway-assigned UUID. The email is the username: it is
        stored in lower case and must be unique regardless of case.
        The password is stored as a PBKDF2-HMAC-SHA256 hash. A new admin user is enabled and gets
        `createdAt` from the gateway; a body carrying any other field, such as `enabled` or
        `createdAt`, is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
      responses:
        '201':
          description: The created admin user; `Location` points at it
          headers:
            Location:
              schema:
                type: string
              description: '`/admin/users/{id}` of the new admin user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/users/{id}:
    get:
      summary: Get an admin user
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        '200':
          description: The admin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an admin user
      description: |
        Changes the given fields and keeps the rest, so an admin user can be disabled or renamed
        without their password. An empty `displayName` clears it. Changing the email keeps the admin
        user signed in: their tokens carry their id. Disabling them revokes their tokens immediately.
        A body carrying any other field is rejected. Disabling your own admin user, or the last
        enabled one, is refused with a `409` naming the reason.
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRequest'
      responses:
        '200':
          description: The updated admin user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete an admin user
      description: |
        Removes the admin user. Tokens already issued to them stop working immediately. Deleting your
        own admin user, or the last enabled one, is refused with a `409` naming the reason.
      parameters:
        - $ref: '#/components/parameters/AdminUserId'
      responses:
        '204':
          description: Admin user deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /modules:
    get:
      summary: List modules
      description: |
        Every module the gateway knows, with its effective state, sorted by id. A module with no
        stored state is enabled.
      responses:
        '200':
          description: The modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /modules/{id}:
    get:
      summary: Get a module
      description: The module's effective state; enabled when no state is stored for it.
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      responses:
        '200':
          description: The module
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '404':
          description: Unknown module id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      summary: Upsert a module
      description: Adds or replaces the module `id`. An unknown module id is refused with `404`.
      parameters:
        - $ref: '#/components/parameters/ModuleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModuleRequest'
      responses:
        '200':
          description: The stored module
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token from `POST /oauth/token`. Only enforced with `admin.auth.type: oauth`.
  parameters:
    TopicName:
      name: name
      in: path
      required: true
      description: The topic name - a virtual alias or a physical broker topic.
      schema:
        type: string
    ConfigEntryName:
      name: name
      in: path
      required: true
      description: The config entry name (role, group, username, or governance rule).
      schema:
        type: string
    AdminUserId:
      name: id
      in: path
      required: true
      description: The admin user's gateway-assigned id.
      schema:
        type: string
        format: uuid
    ModuleId:
      name: id
      in: path
      required: true
      description: The module's stable id.
      schema:
        type: string
        enum: [virtual-topics, rbac, governance]
  responses:
    Unauthorized:
      description: |
        Missing, invalid or expired bearer token (only with `admin.auth.type: oauth`)
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer realm="kawa"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request (malformed body, missing field, or unsupported value)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Topic rejected by governance
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Path, topic, or config entry not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: Path exists but the method is not registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Topic already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Handler or serialization failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Module:
      type: object
      required:
        - id
        - enabled
      properties:
        id:
          type: string
          enum: [virtual-topics, rbac, governance]
        enabled:
          type: boolean
    ModuleRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: |
            Access token lifetime in seconds (`admin.auth.settings.tokenTtl`, capped at the session end).
        refresh_token:
          type: string
          description: |
            Refresh token, valid until the session ends (`admin.auth.settings.sessionTtl`). Not accepted
            as a bearer token.
    TokenError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        error_description:
          type: string
    CreateAdminUserRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: The username to log in with; stored in lower case.
        password:
          type: string
          format: password
        displayName:
          type: string
          description: An optional human-readable label to tell admin users apart.
    UpdateAdminUserRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Must not be blank.
        displayName:
          type: string
          description: An empty value clears it.
        enabled:
          type: boolean
    AdminUserView:
      type: object
      required:
        - id
        - email
        - displayName
        - enabled
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
          nullable: true
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    TopicView:
      type: object
      required:
        - type
        - name
        - partitions
        - replicationFactor
      properties:
        type:
          type: string
          enum:
            - virtual
            - physical
          description: Virtual topics carry an alias; physical topics are raw broker topics.
        name:
          type: string
          description: The display name - virtual alias for virtual topics, physical name otherwise.
        partitions:
          type: integer
          format: int32
          description: From the live metadata cache.
        replicationFactor:
          type: integer
          format: int32
          description: From the live metadata cache.
        filter:
          allOf:
            - $ref: '#/components/schemas/TopicFilterView'
          nullable: true
          description: Structured consume-filter, or null if none.
        physicalTopic:
          type: string
          nullable: true
          description: The broker-side topic name, only present when type is virtual.
        exposePhysicalTopic:
          type: boolean
          nullable: true
          description: Virtual topics only; true when the physical topic is also served directly, null for physical topics.
        valueFormat:
          allOf:
            - $ref: '#/components/schemas/PayloadFormat'
          nullable: true
          description: Encoding of record values, or null if none (raw strings).
    TopicFilterView:
      type: object
      required:
        - kind
        - expression
      properties:
        kind:
          type: string
          enum:
            - cel
            - header
            - headerContains
            - headerStartsWith
            - headerMatches
        expression:
          type: string
          description: The CEL expression, the header=value pair for headerEquals, or a header <operator> value description for the other header predicates.
    TopicRequest:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - virtual
            - physical
        name:
          type: string
        partitions:
          type: integer
          format: int32
          description: Physical topics only; omitted means the broker default.
        replicationFactor:
          type: integer
          format: int32
          description: Physical topics only; omitted means the broker default.
        configs:
          type: object
          additionalProperties:
            type: string
          description: Physical topics only; topic configs keyed by config name.
        topic:
          type: string
          description: Virtual topics only; the physical backing topic.
        filter:
          allOf:
            - $ref: '#/components/schemas/VirtualTopicFilter'
          description: Virtual topics only; optional consume filter.
        exposePhysicalTopic:
          type: boolean
          description: Virtual topics only; whether the physical topic is also served directly.
        valueFormat:
          allOf:
            - $ref: '#/components/schemas/PayloadFormat'
          description: Virtual topics only; optional encoding of record values, letting CEL filters read the decoded value.
    VirtualTopicConfigView:
      type: object
      required:
        - topic
        - exposePhysicalTopic
      properties:
        topic:
          type: string
          description: The physical backing topic.
        filter:
          allOf:
            - $ref: '#/components/schemas/VirtualTopicFilter'
          nullable: true
        exposePhysicalTopic:
          type: boolean
        valueFormat:
          allOf:
            - $ref: '#/components/schemas/PayloadFormat'
          nullable: true
    VirtualTopicConfigPatch:
      type: object
      properties:
        name:
          type: string
          description: Optional new virtual topic name.
        topic:
          type: string
          description: Optional physical backing topic; omitted values are preserved.
        filter:
          allOf:
            - $ref: '#/components/schemas/VirtualTopicFilter'
          nullable: true
          description: Optional filter; omitted or null means no filter.
        exposePhysicalTopic:
          type: boolean
          description: Optional physical-topic exposure setting.
        valueFormat:
          allOf:
            - $ref: '#/components/schemas/PayloadFormat'
          nullable: true
          description: Optional value format; omitted or null means raw values. Replaced together with filter.
    PayloadFormat:
      oneOf:
        - $ref: '#/components/schemas/JsonFormat'
      discriminator:
        propertyName: type
        mapping:
          json: '#/components/schemas/JsonFormat'
    JsonFormat:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - json
        onDecodeError:
          type: string
          enum:
            - skip
            - include
            - fail
          default: skip
          description: What to do with a record whose value is not valid JSON - drop it, deliver it, or fail the fetch.
    VirtualTopicFilter:
      oneOf:
        - $ref: '#/components/schemas/HeaderEqualsFilter'
        - $ref: '#/components/schemas/CelFilter'
      discriminator:
        propertyName: type
        mapping:
          headerEquals: '#/components/schemas/HeaderEqualsFilter'
          cel: '#/components/schemas/CelFilter'
    HeaderEqualsFilter:
      type: object
      required:
        - type
        - header
        - value
      properties:
        type:
          type: string
          enum:
            - headerEquals
        header:
          type: string
          description: Header key to compare.
        value:
          type: string
          description: Expected header value.
    CelFilter:
      type: object
      required:
        - type
        - expression
      properties:
        type:
          type: string
          enum:
            - cel
        expression:
          type: string
          description: The CEL expression selecting records to keep.
    TopicSpecView:
      type: object
      required:
        - name
        - partitions
        - replicationFactor
      properties:
        name:
          type: string
        partitions:
          type: integer
          format: int32
          description: Requested partitions, or -1 for the broker default.
        replicationFactor:
          type: integer
          format: int32
          description: Requested replication factor, or -1 for the broker default.
        configs:
          type: object
          additionalProperties:
            type: string
    GovernanceConfigView:
      type: object
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceRuleConfigView'
        exemptions:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceExemption'
          description: Global exemptions; each skips every rule.
        variables:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceVariable'
    GovernanceRuleConfigView:
      type: object
      properties:
        name:
          type: string
          description: Unique, human-readable name of the rule.
        errorMessage:
          type: string
          description: Message shown when the rule rejects a resource.
        description:
          type: string
          nullable: true
          description: Longer explanation of what the rule enforces.
        selector:
          $ref: '#/components/schemas/GovernanceSelector'
        match:
          $ref: '#/components/schemas/GovernanceMatch'
        subRules:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceSubRule'
        exemptions:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceExemption'
    GovernanceRuleRequest:
      type: object
      required:
        - errorMessage
        - selector
      properties:
        name:
          type: string
          description: Optional; when present it must equal the path name.
        errorMessage:
          type: string
          description: Message shown when the rule rejects a resource.
        description:
          type: string
          description: Longer explanation of what the rule enforces.
        selector:
          $ref: '#/components/schemas/GovernanceSelector'
        match:
          $ref: '#/components/schemas/GovernanceMatch'
        subRules:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceSubRule'
          description: The checks and groups making up the rule; required unless `expression` is set.
        expression:
          allOf:
            - $ref: '#/components/schemas/GovernanceExpression'
          description: Legacy single expression; becomes one check. Mutually exclusive with `subRules`.
        exemptions:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceExemption'
          description: |
            Named cases the rule does not apply to; absent means none. When any exemption
            evaluates to `true` for a request, the rule is skipped for that request only.
    GovernanceExemption:
      type: object
      required:
        - name
        - expression
      properties:
        name:
          type: string
          description: Unique name of the exemption within its rule.
        description:
          type: string
          nullable: true
          description: Why the exemption exists.
        expression:
          $ref: '#/components/schemas/GovernanceExpression'
    GovernanceVariable:
      type: object
      required:
        - type
        - value
      properties:
        name:
          type: string
          description: A CEL identifier; optional in a PUT body, where it must equal the path name.
        type:
          type: string
          enum: [string, int, double, bool, list<string>, list<int>]
        value:
          type: string
          description: The literal in JSON syntax, e.g. `"[1, 4, 6, 12]"` or `"\"^app\\\\..+$\""`.
        note:
          type: string
          nullable: true
        samples:
          type: object
          additionalProperties:
            type: string
          description: Admin UI pattern-table hints; stored, never read by the gateway.
        notes:
          type: object
          additionalProperties:
            type: string
          description: Admin UI pattern-table hints; stored, never read by the gateway.
        extraExamples:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Admin UI pattern-table hints; stored, never read by the gateway.
    GovernanceDryRunRequest:
      type: object
      required:
        - resourceType
        - resource
      properties:
        resourceType:
          type: string
          enum: [TOPIC, GROUP, TRANSACTIONAL_ID]
        operation:
          type: string
          enum: [CREATE, ALTER, DELETE]
          description: "Default `CREATE`. On `ALTER`, describe the topic as it will be after the change - its partitions, replication factor and configs (overrides) with the change applied. On `DELETE`, describe it as it is."
        virtual:
          type: boolean
          description: Topics only; evaluate as a virtual topic. Default false.
        resource:
          type: object
          additionalProperties: true
          description: |
            Physical topic - `name`, `partitions`, `replicationFactor`, `configs`; virtual topic -
            `name`, `physicalTopic`; group and transactional id - `id`.
        principal:
          type: string
        service:
          type: string
        rule:
          allOf:
            - $ref: '#/components/schemas/GovernanceRuleRequest'
          description: Optional unsaved rule to evaluate instead of the stored rules.
    GovernanceDryRunView:
      type: object
      properties:
        allowed:
          type: boolean
        exemptedBy:
          type: string
          nullable: true
          description: The global exemption that matched; no rule ran.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceRuleTrace'
    GovernanceOutcome:
      type: string
      enum: [PASS, FAIL, ERROR, SKIPPED, EXEMPTED]
      description: |
        `SKIPPED` - a rule whose selector is false, or a sub-rule an earlier sibling already
        decided. `EXEMPTED` - one of the rule's own exemptions matched.
    GovernanceRuleTrace:
      type: object
      properties:
        rule:
          type: string
        outcome:
          $ref: '#/components/schemas/GovernanceOutcome'
        detail:
          type: string
          nullable: true
          description: The evaluation error, for `ERROR`.
        exemptedBy:
          type: string
          nullable: true
        path:
          type: array
          items:
            type: string
          description: On failure, the sub-rule names leading to the decisive failure.
        message:
          type: string
          nullable: true
          description: On failure, the most specific error message along `path`.
        subRules:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceNodeTrace'
    GovernanceNodeTrace:
      type: object
      properties:
        name:
          type: string
        outcome:
          $ref: '#/components/schemas/GovernanceOutcome'
        detail:
          type: string
          nullable: true
        checks:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceNodeTrace'
    GovernanceMatch:
      type: string
      enum: [ALL, ANY]
      description: How sub-rules combine - every one must hold (`ALL`) or at least one (`ANY`).
    GovernanceSubRule:
      type: object
      required:
        - kind
        - name
      description: |
        A check (`kind: check`, with `expression`) or a group of checks (`kind: group`, with
        `match` and `checks`). A group holds checks only, never another group.
      properties:
        kind:
          type: string
          enum: [check, group]
        name:
          type: string
          description: Unique among its siblings.
        errorMessage:
          type: string
          nullable: true
          description: Optional; falls back to the nearest ancestor's message.
        expression:
          allOf:
            - $ref: '#/components/schemas/GovernanceExpression'
          description: A check's expression.
        match:
          allOf:
            - $ref: '#/components/schemas/GovernanceMatch'
          description: How a group's checks combine.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/GovernanceSubRule'
          description: A group's checks; each has `kind` `check`.
    GovernanceSelector:
      type: object
      required:
        - resourceType
      properties:
        resourceType:
          type: string
          enum: [TOPIC, GROUP, TRANSACTIONAL_ID]
          description: |
            Kafka resource type the rule targets. Expressions read `topic`, `group` or
            `transaction` accordingly.
        scope:
          type: string
          enum: [BOTH, PHYSICAL, VIRTUAL]
          description: |
            Topics only: physical topics, virtual topics or both (default).
        operations:
          type: array
          items:
            type: string
            enum: [CREATE, ALTER, DELETE]
          description: |
            Topics only: the requests the rule runs on - CreateTopics (`CREATE`, the default),
            AlterConfigs, IncrementalAlterConfigs and CreatePartitions (`ALTER`), and DeleteTopics
            (`DELETE`); on the Admin API creating, changing and deleting topics. On alter the rule
            sees the topic as it will be after the change: its current partitions, replication
            factor and configs (overrides) with the change applied. On delete it sees the topic
            as it is.
        expression:
          allOf:
            - $ref: '#/components/schemas/GovernanceExpression'
          nullable: true
          description: Narrows the selected resources; absent or `null` selects them all.
    GovernanceExpression:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum: [CEL]
          description: Expression language; only `CEL` is supported today.
        value:
          type: string
          description: |
            The expression source. Bindings: `principal`, `service`, and the resource - for
            topics `topic.name`, `topic.virtual`, `topic.partitions`, `topic.replicationFactor`
            and `topic.configs`; for groups `group.id`; for transactional ids `transaction.id`.
            Every governance variable is available by name.
    ClientConfigRequest:
      type: object
      required:
        - password
      properties:
        mechanism:
          type: string
          description: SASL mechanism (e.g. PLAIN, SCRAM-SHA-256, SCRAM-SHA-512).
        password:
          type: string
          description: Password; may reference environment variables as ${VAR} or ${VAR:-default}.
        groups:
          type: array
          items:
            type: string
          description: Existing RBAC groups the client should belong to; omitted means no groups on create.
    ClientConfigPatch:
      type: object
      properties:
        mechanism:
          type: string
          description: SASL mechanism (e.g. PLAIN, SCRAM-SHA-256, SCRAM-SHA-512); omitted to keep the current mechanism.
        password:
          type: string
          description: New password; may reference environment variables as ${VAR} or ${VAR:-default}. Omitted to keep the current password.
        groups:
          type: array
          items:
            type: string
          description: Replaces the client's RBAC group memberships; omitted to keep current memberships.
    ClientConfigView:
      type: object
      required:
        - username
      properties:
        username:
          type: string
          description: The SASL username.
        mechanism:
          type: string
          description: SASL mechanism (e.g. PLAIN, SCRAM-SHA-256, SCRAM-SHA-512).
    RoleConfigRequest:
      type: object
      properties:
        acls:
          type: array
          items:
            $ref: '#/components/schemas/AclConfig'
          description: The ACLs making up this role.
    RolePutView:
      type: object
      properties:
        acls:
          type: array
          items:
            $ref: '#/components/schemas/AclConfig'
          description: The ACLs making up this role.
    RoleConfigView:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The role name.
        acls:
          type: array
          items:
            $ref: '#/components/schemas/AclConfig'
          description: The ACLs making up this role.
    GroupConfigRequest:
      type: object
      properties:
        clients:
          type: array
          items:
            type: string
          description: The usernames in this group.
        roles:
          type: array
          items:
            type: string
          description: The roles whose ACLs every client inherits.
    GroupPutView:
      type: object
      properties:
        clients:
          type: array
          items:
            type: string
          description: The usernames in this group.
        roles:
          type: array
          items:
            type: string
          description: The roles whose ACLs every client inherits.
    GroupConfigPatch:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The new group name; the group's clients and roles move with it.
    GroupConfigView:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: The group name.
        clients:
          type: array
          items:
            type: string
          description: The usernames in this group.
        roles:
          type: array
          items:
            type: string
          description: The roles whose ACLs every client inherits.
    AclConfig:
      type: object
      required:
        - resource
        - operation
      properties:
        resource:
          $ref: '#/components/schemas/ResourceConfig'
        operation:
          type: string
          enum:
            - UNKNOWN
            - ANY
            - ALL
            - READ
            - WRITE
            - CREATE
            - DELETE
            - ALTER
            - DESCRIBE
            - CLUSTER_ACTION
            - DESCRIBE_CONFIGS
            - ALTER_CONFIGS
            - IDEMPOTENT_WRITE
        permission:
          type: string
          enum:
            - ALLOW
            - DENY
          default: ALLOW
          description: Defaults to ALLOW when omitted.
    ResourceConfig:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - UNKNOWN
            - ANY
            - TOPIC
            - GROUP
            - CLUSTER
            - TRANSACTIONAL_ID
            - DELEGATION_TOKEN
            - USER
        pattern:
          type: string
          nullable: true
          description: The resource name; null for CLUSTER, may be empty for PREFIXED.
        patternType:
          type: string
          enum:
            - UNKNOWN
            - ANY
            - MATCH
            - LITERAL
            - PREFIXED
          default: LITERAL
          description: Defaults to LITERAL when omitted.
